<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --link: #38bdf8;
      --border: #273449;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --link: #0369a1;
        --border: #dbe3ef;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    nav,
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav strong {
      margin-right: 8px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    main {
      background: var(--panel);
      margin-top: 24px;
      margin-bottom: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    h1,
    h2,
    h3 {
      line-height: 1.25;
    }

    code {
      background: color-mix(in srgb, var(--border) 55%, transparent);
      padding: 0.1rem 0.25rem;
      border-radius: 4px;
    }

    pre {
      overflow-x: auto;
      padding: 16px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
    }

    .mermaid {
      background: #ffffff;
      color: #111827;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <strong><a href="{{ '/' | relative_url }}">{{ site.title }}</a></strong>
      <a href="{{ '/architecture/module-ownership.html' | relative_url }}">Architecture</a>
      <a href="{{ '/design/identity.html' | relative_url }}">Identity Design</a>
      <a href="{{ '/design/messaging.html' | relative_url }}">Messaging</a>
      <a href="{{ '/adr/0001-modular-monolith-boundaries.html' | relative_url }}">ADR</a>
      <a href="https://github.com/nitrogen-nit/nitrogen-backend">GitHub</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: "default" });
  </script>
</body>
</html>
