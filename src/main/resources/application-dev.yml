# Shared development environment profile. All endpoints and credentials must be
# provided by environment variables or secret stores.

application:
  environment: ${NITROGEN_ENVIRONMENT}

spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: when-authorized
  opentelemetry:
    enabled: ${NITROGEN_TRACING_ENABLED:true}
  tracing:
    enabled: ${NITROGEN_TRACING_ENABLED:true}
    export:
      enabled: ${NITROGEN_TRACING_ENABLED:true}
      otlp:
        enabled: ${NITROGEN_TRACING_ENABLED:true}
    sampling:
      probability: ${NITROGEN_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      console: logstash
  level:
    vn.nitrogen: ${NITROGEN_LOG_LEVEL:INFO}
