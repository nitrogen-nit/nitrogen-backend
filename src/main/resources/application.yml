# Cấu hình chung cho mọi chế độ chạy.
# Các giá trị đánh dấu §… là ràng buộc từ đặc tả, không đổi khi chưa sửa đặc tả.

spring:
  config:
    import: optional:file:.env.local[.properties]

  application:
    name: nitrogen-backend

  # Một artifact, hai chế độ chạy. Profile `core` bật ở cả hai để các facade
  # cross-module (@Profile("core")) luôn có mặt.
  profiles:
    group:
      web: core
      worker: core

  datasource:
    # Dev/prod intentionally have no default database credentials. Local
    # development defaults live in application-local.yml.
    url: ${NITROGEN_DB_URL}
    username: ${NITROGEN_DB_USER}
    password: ${NITROGEN_DB_PASSWORD}
    hikari:
      pool-name: nitrogen-pool
      maximum-pool-size: ${NITROGEN_DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate          # §7, §16.2 — Flyway là cơ chế duy nhất đổi schema
    open-in-view: false           # §15 — transaction kết thúc tại service layer
    properties:
      hibernate:
        jdbc:
          batch_size: 50          # §15
        order_inserts: true       # §15
        order_updates: true       # §15

  flyway:
    # KHÔNG dùng wildcard `db/migration/**`: Flyway chỉ hỗ trợ wildcard cho
    # location kiểu `filesystem:`. Với `classpath:` nó quét đệ quy sẵn, nên một
    # dòng này đã bao trọn 12 thư mục module — thêm `/**` lại làm nó không khớp
    # gì cả và Flyway im lặng chạy 0 migration.
    locations: classpath:db/migration
    # Schema riêng cho bảng lịch sử của chính Flyway, tách khỏi 12 schema nghiệp vụ.
    schemas: flyway_history
    default-schema: flyway_history

  rabbitmq:
    host: ${NITROGEN_RABBIT_HOST}
    port: ${NITROGEN_RABBIT_PORT}
    username: ${NITROGEN_RABBIT_USER}
    password: ${NITROGEN_RABBIT_PASSWORD}

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        # Metrics are pulled by Prometheus; OTLP is reserved for traces in this baseline.
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true             # bật /actuator/health/liveness và /readiness
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    # Rabbit không phải điều kiện readiness của web replica: web vẫn phục vụ
    # được request đọc khi broker chết, đẩy event thì đã có outbox đỡ.
    rabbit:
      enabled: ${NITROGEN_RABBIT_HEALTH_ENABLED:false}
  info:
    env:
      enabled: true
  opentelemetry:
    enabled: ${NITROGEN_TRACING_ENABLED:false}
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: ${application.version:unknown}
      deployment.environment.name: ${application.environment}
    tracing:
      export:
        otlp:
          endpoint: ${NITROGEN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${NITROGEN_TRACING_ENABLED:false}
    export:
      enabled: ${NITROGEN_TRACING_ENABLED:false}
      otlp:
        enabled: ${NITROGEN_TRACING_ENABLED:false}
    sampling:
      probability: ${NITROGEN_TRACING_SAMPLING_PROBABILITY:0.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

nitrogen:
  contracts:
    # Backend đọc JSON Schema từ classpath — resource này được map từ
    # contracts/json-schema qua <resource> trong pom.xml, không copy tay.
    json-schema-location: classpath:json-schema/

application:
  environment: ${NITROGEN_ENVIRONMENT}
  version: ${NITROGEN_APPLICATION_VERSION:${spring.application.version:unknown}}

logging:
  level:
    vn.nitrogen: ${NITROGEN_LOG_LEVEL:INFO}
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${application.version}
        environment: ${application.environment}
    json:
      context:
        include: false
      customizer:
        - vn.nitrogen.platform.observability.NitrogenStructuredLoggingJsonMembersCustomizer
      add:
        service: ${spring.application.name}
        environment: ${application.environment}
        applicationVersion: ${application.version}
      rename:
        "@timestamp": timestamp
        "logger_name": logger
        "log.logger": logger
        "log.level": level
