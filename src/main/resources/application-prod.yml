# Ràng buộc production.

application:
  environment: ${NITROGEN_ENVIRONMENT}

spring:
  flyway:
    # §16.2.4 — migration là step CI/CD riêng. Nhiều replica rollout cùng lúc
    # không được tranh nhau chạy migration.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

management:
  opentelemetry:
    enabled: ${NITROGEN_TRACING_ENABLED:true}
  tracing:
    enabled: ${NITROGEN_TRACING_ENABLED:true}
    export:
      enabled: ${NITROGEN_TRACING_ENABLED:true}
      otlp:
        enabled: ${NITROGEN_TRACING_ENABLED:true}
    sampling:
      probability: ${NITROGEN_TRACING_SAMPLING_PROBABILITY:0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
  level:
    vn.nitrogen: ${NITROGEN_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
