# Ràng buộc production.

spring:
  flyway:
    # §16.2.4 — migration là step CI/CD riêng. Nhiều replica rollout cùng lúc
    # không được tranh nhau chạy migration.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    vn.nitrogen: INFO
    org.hibernate.SQL: WARN
