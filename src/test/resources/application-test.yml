# Profile test: datasource và rabbit do @ServiceConnection của Testcontainers cấp.
# Flyway bật để MigrateFromEmptyDbTest kiểm đúng đường "cài mới".

application:
  environment: test
  version: test

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: nitrogen
    password: nitrogen
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: flyway_history
    default-schema: flyway_history

management:
  opentelemetry:
    enabled: false
  tracing:
    enabled: false
    export:
      enabled: false
      otlp:
        enabled: false
    sampling:
      probability: 0.0

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
