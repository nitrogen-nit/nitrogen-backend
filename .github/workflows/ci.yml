name: Backend CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  MAVEN_ARGS: "-B --no-transfer-progress"

jobs:
  backend-format:
    name: backend-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Check formatting and static analysis
        run: ./mvnw $MAVEN_ARGS -DskipTests compile spotless:check spotbugs:check

  backend-unit-test:
    name: backend-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: ./mvnw $MAVEN_ARGS test -Punit

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore

  backend-architecture-test:
    name: backend-architecture-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run architecture tests
        run: ./mvnw $MAVEN_ARGS test -Parchitecture

      - name: Upload architecture test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-architecture-test-reports
          path: |
            target/surefire-reports/**
            target/spring-modulith-docs/**
          if-no-files-found: ignore

  backend-integration-test:
    name: backend-integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run integration tests
        run: ./mvnw $MAVEN_ARGS test -Pintegration

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore

  backend-migration-test:
    name: backend-migration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Flyway migration tests on clean PostgreSQL
        run: ./mvnw $MAVEN_ARGS test -Pmigration

      - name: Upload migration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-test-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    needs:
      - backend-format
      - backend-unit-test
      - backend-architecture-test
      - backend-integration-test
      - backend-migration-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build executable JAR and SBOM
        run: ./mvnw $MAVEN_ARGS package -DskipTests

      - name: Prepare build artifacts
        id: artifact
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          jar_source="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "$jar_source"
          jar_name="nitrogen-backend-${git_sha}.jar"
          cp "$jar_source" "target/$jar_name"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "jar_name=$jar_name" >> "$GITHUB_OUTPUT"

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ steps.artifact.outputs.git_sha }}
          path: target/${{ steps.artifact.outputs.jar_name }}

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-${{ steps.artifact.outputs.git_sha }}
          path: target/bom.json
          if-no-files-found: error

  backend-sonar:
    name: backend-sonar
    runs-on: ubuntu-latest
    needs:
      - backend-format
      - backend-unit-test
      - backend-architecture-test
      - backend-integration-test
      - backend-migration-test
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify SonarQube configuration
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_TOKEN"

      - name: Run tests, coverage, and SonarQube quality gate
        run: >
          ./mvnw $MAVEN_ARGS verify sonar:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-xml
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
